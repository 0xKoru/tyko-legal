<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tyko — Legal</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0a; color: #f5f5f5; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; }
  .logo { font-size: 2.5em; font-weight: 900; letter-spacing: -2px; margin-bottom: 8px; }
  .logo span { color: #CCFF00; }
  .tagline { color: #666; font-size: 0.9em; margin-bottom: 48px; }
  .cards { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  .card { background: #111; border: 1px solid #222; border-radius: 16px; padding: 28px 36px; text-align: center; text-decoration: none; color: inherit; transition: border-color 0.2s, transform 0.2s; min-width: 200px; }
  .card:hover { border-color: #CCFF00; transform: translateY(-2px); }
  .card .icon { font-size: 2em; margin-bottom: 12px; }
  .card h2 { font-size: 1.1em; font-weight: 600; margin-bottom: 6px; }
  .card p { color: #666; font-size: 0.85em; }
  footer { margin-top: 48px; color: #444; font-size: 0.8em; }
</style>
</head>
<body>
  <div class="logo">Tyk<span>o</span></div>
  <p class="tagline">Legal &amp; Privacy</p>
  <div class="cards">
    <a href="fitformai-privacy.html" class="card">
      <div class="icon">🔒</div>
      <h2>Privacy Policy</h2>
      <p>FitForm AI data practices</p>
    </a>
    <a href="fitformai-terms.html" class="card">
      <div class="icon">📄</div>
      <h2>Terms of Use</h2>
      <p>FitForm AI terms &amp; conditions</p>
    </a>
  </div>
  <footer>© 2026 Tyko. All rights reserved.</footer>
</body>
</html>
